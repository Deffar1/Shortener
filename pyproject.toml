[project]
name = "shortener"
version = "0.1.0"
description = "Современный асинхронный Telegram-бот с API на базе FastAPI для создания и управления короткими ссылками"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "motor>=3.7.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]
